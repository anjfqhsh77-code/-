<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>한글 끝말잇기</title>
<style>
  :root {
    color-scheme: light;
    --ground: #EDF0EF;
    --surface: #FFFFFF;
    --surface-2: #F5F8F7;
    --ink: #131C1A;
    --ink-soft: #56635F;
    --line: #D6DDDA;
    --accent: #2F4FA8;
    --accent-soft: #E7ECF9;
    --foe: #4F5B57;
    --foe-soft: #E8EDEB;
    --good: #1C7355;
    --bad: #AF3A2B;
    --shadow: 0 1px 2px rgba(19, 28, 26, .06), 0 8px 24px -16px rgba(19, 28, 26, .35);
    --font-display: "Nanum Myeongjo", "AppleMyungjo", "Batang", Georgia, serif;
    --font-body: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --ground: #0F1518;
      --surface: #182025;
      --surface-2: #1E282D;
      --ink: #E6EDF0;
      --ink-soft: #9BA9AE;
      --line: #2A353B;
      --accent: #95AEFF;
      --accent-soft: #1C2842;
      --foe: #B4C3BD;
      --foe-soft: #232E31;
      --good: #5FD0A4;
      --bad: #FF8E77;
      --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 8px 24px -16px rgba(0, 0, 0, .8);
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --ground: #0F1518;
    --surface: #182025;
    --surface-2: #1E282D;
    --ink: #E6EDF0;
    --ink-soft: #9BA9AE;
    --line: #2A353B;
    --accent: #95AEFF;
    --accent-soft: #1C2842;
    --foe: #B4C3BD;
    --foe-soft: #232E31;
    --good: #5FD0A4;
    --bad: #FF8E77;
    --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 8px 24px -16px rgba(0, 0, 0, .8);
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--ground);
    color: var(--ink);
    font-family: var(--font-body);
    font-size: 15px;
    line-height: 1.5;
    -webkit-text-size-adjust: 100%;
  }
  [hidden] { display: none !important; }
  button, select, input { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .app {
    display: flex;
    flex-direction: column;
    gap: 14px;
    height: 100%;
    max-width: 940px;
    margin: 0 auto;
    padding-inline: 16px;
    padding-block: 18px;
  }

  /* 머리말 */
  .masthead {
    display: flex;
    flex-wrap: wrap;
    align-items: flex-end;
    justify-content: space-between;
    gap: 12px 16px;
  }
  .brand { display: flex; align-items: center; gap: 12px; }
  .brand__mark {
    display: grid;
    place-items: center;
    width: 42px;
    height: 42px;
    border-radius: 10px;
    background: var(--accent);
    color: var(--surface);
    font-family: var(--font-display);
    font-size: 24px;
    line-height: 1;
    padding-bottom: 2px;
  }
  h1 {
    margin: 0;
    font-family: var(--font-display);
    font-size: 25px;
    font-weight: 700;
    letter-spacing: -.01em;
  }
  .brand__sub { margin: 1px 0 0; color: var(--ink-soft); font-size: 12.5px; }

  .controls { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
  .field { display: flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--ink-soft); }
  select {
    appearance: none;
    padding: 6px 26px 6px 10px;
    border: 1px solid var(--line);
    border-radius: 8px;
    background: var(--surface) url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='10' height='6'%3E%3Cpath d='M1 1l4 4 4-4' fill='none' stroke='%2356635F' stroke-width='1.6' stroke-linecap='round'/%3E%3C/svg%3E") no-repeat right 9px center;
    color: var(--ink);
    font-size: 13px;
    cursor: pointer;
  }
  .btn {
    padding: 7px 14px;
    border: 1px solid var(--line);
    border-radius: 8px;
    background: var(--surface);
    color: var(--ink);
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: background-color .15s ease, border-color .15s ease;
  }
  .btn:hover { background: var(--surface-2); }
  .btn:disabled { opacity: .45; cursor: default; }
  .btn--primary {
    border-color: transparent;
    background: var(--accent);
    color: var(--surface);
  }
  .btn--primary:hover { background: var(--accent); filter: brightness(1.08); }
  .btn--go { padding-inline: 20px; }

  /* 판 */
  .board {
    flex: 1;
    display: grid;
    grid-template-columns: 1fr 248px;
    gap: 14px;
    min-height: 0;
  }
  .chain {
    display: flex;
    flex-direction: column;
    gap: 10px;
    min-height: 0;
    overflow-y: auto;
    padding: 16px;
    border: 1px solid var(--line);
    border-radius: 14px;
    background: var(--surface);
    box-shadow: var(--shadow);
    scroll-behavior: smooth;
  }
  .empty { margin: auto 0; text-align: center; color: var(--ink-soft); }
  .empty p { margin: 0 0 12px; }
  .seeds { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
  .seed {
    padding: 6px 12px;
    border: 1px dashed var(--line);
    border-radius: 999px;
    background: transparent;
    color: var(--ink);
    font-family: var(--font-display);
    font-size: 15px;
    cursor: pointer;
  }
  .seed:hover { border-style: solid; border-color: var(--accent); color: var(--accent); }

  .card { display: flex; flex-direction: column; gap: 3px; max-width: 78%; }
  .card--me { align-self: flex-end; align-items: flex-end; }
  .card--computer { align-self: flex-start; align-items: flex-start; }
  .card__who {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: .08em;
    color: var(--ink-soft);
  }
  .card--me .card__who { color: var(--accent); }
  .word { display: flex; gap: 3px; }
  .syl {
    display: grid;
    place-items: center;
    min-width: 34px;
    height: 38px;
    padding: 0 4px 3px;
    border: 1px solid var(--line);
    border-radius: 7px;
    background: var(--surface-2);
    font-family: var(--font-display);
    font-size: 21px;
    line-height: 1;
  }
  .card--me .syl { background: var(--accent-soft); border-color: transparent; }
  .card--computer .syl { background: var(--foe-soft); border-color: transparent; }
  .syl--link { box-shadow: inset 0 -3px 0 var(--accent); }
  .card--computer .syl--link { box-shadow: inset 0 -3px 0 var(--foe); }
  .card--new { animation: rise .22s ease-out both; }
  @keyframes rise { from { opacity: 0; transform: translateY(6px); } }

  /* 오른쪽 패널 */
  .pane { display: flex; flex-direction: column; gap: 10px; min-height: 0; }
  .panel {
    padding: 14px;
    border: 1px solid var(--line);
    border-radius: 14px;
    background: var(--surface);
    box-shadow: var(--shadow);
  }
  .panel--turn { display: grid; gap: 8px; justify-items: center; text-align: center; }
  .label {
    margin: 0;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: .1em;
    color: var(--ink-soft);
  }
  .tile {
    display: grid;
    place-items: center;
    width: 84px;
    height: 84px;
    border-radius: 16px;
    background: var(--accent);
    color: var(--surface);
    font-family: var(--font-display);
    font-size: 46px;
    line-height: 1;
    padding-bottom: 4px;
  }
  .tile--idle { background: var(--surface-2); color: var(--ink-soft); }
  .also { margin: 0; font-size: 12.5px; color: var(--ink-soft); min-height: 1.4em; }
  .also b { color: var(--ink); font-family: var(--font-display); font-weight: 400; }

  .stats { display: grid; gap: 7px; font-size: 13px; }
  .stat { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
  .stat dt { color: var(--ink-soft); }
  .stat dd { margin: 0; font-weight: 600; font-variant-numeric: tabular-nums; }

  /* 입력 */
  .composer { display: flex; gap: 8px; }
  .composer input {
    flex: 1;
    min-width: 0;
    padding: 11px 14px;
    border: 1px solid var(--line);
    border-radius: 10px;
    background: var(--surface);
    font-family: var(--font-display);
    font-size: 18px;
  }
  .composer input::placeholder { font-family: var(--font-body); font-size: 14px; color: var(--ink-soft); }
  .composer input:disabled { background: var(--surface-2); }

  .timer { height: 4px; border-radius: 999px; background: var(--line); overflow: hidden; }
  .timer__fill {
    height: 100%;
    width: 100%;
    background: var(--accent);
    transform-origin: left center;
  }
  .timer__fill--low { background: var(--bad); }

  .status {
    margin: 0;
    min-height: 1.5em;
    font-size: 13.5px;
    color: var(--ink-soft);
  }
  .status--bad { color: var(--bad); }
  .status--good { color: var(--good); }
  .status--win, .status--lose {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 11px 14px;
    border-radius: 10px;
    font-size: 14.5px;
    font-weight: 600;
    min-height: 0;
  }
  .status--win { background: var(--accent-soft); color: var(--accent); }
  .status--lose { background: var(--foe-soft); color: var(--ink); }

  .foot { margin: 0; font-size: 11.5px; color: var(--ink-soft); }

  @media (max-width: 760px) {
    .board { grid-template-columns: 1fr; grid-template-rows: auto 1fr; }
    .pane { flex-direction: row; align-items: stretch; }
    .panel--turn { flex: 1; grid-auto-flow: column; justify-items: start; align-items: center; text-align: left; gap: 12px; }
    .panel--stats { display: none; }
    .tile { width: 60px; height: 60px; font-size: 34px; border-radius: 12px; }
    .card { max-width: 88%; }
  }
  @media (prefers-reduced-motion: reduce) {
    .card--new { animation: none; }
    .chain { scroll-behavior: auto; }
    .btn { transition: none; }
  }
</style>
</head>
<body>
<div class="app">
  <header class="masthead">
    <div class="brand">
      <span class="brand__mark" aria-hidden="true">끝</span>
      <div>
        <h1>한글 끝말잇기</h1>
        <p class="brand__sub">컴퓨터와 한 판 · 낱말 <span id="dictCount">0</span>개</p>
      </div>
    </div>
    <div class="controls">
      <label class="field" for="difficulty">난이도
        <select id="difficulty">
          <option value="easy">쉬움</option>
          <option value="normal" selected>보통</option>
          <option value="hard">어려움</option>
        </select>
      </label>
      <label class="field" for="first">선공
        <select id="first">
          <option value="me" selected>나</option>
          <option value="computer">컴퓨터</option>
        </select>
      </label>
      <label class="field" for="timeLimit">제한 시간
        <select id="timeLimit">
          <option value="0" selected>없음</option>
          <option value="10">10초</option>
          <option value="20">20초</option>
          <option value="30">30초</option>
        </select>
      </label>
      <button type="button" class="btn" id="restart">새 판</button>
    </div>
  </header>

  <main class="board">
    <section class="chain" id="chain" aria-live="polite" aria-label="나온 단어">
      <div class="empty" id="empty">
        <p>아무 낱말로나 시작하세요.</p>
        <div class="seeds" id="seeds"></div>
      </div>
    </section>

    <aside class="pane">
      <div class="panel panel--turn">
        <p class="label">다음 글자</p>
        <div class="tile tile--idle" id="nextChar" aria-live="polite">·</div>
        <p class="also" id="also"></p>
      </div>
      <div class="panel panel--stats">
        <dl class="stats">
          <div class="stat"><dt>내가 낸 단어</dt><dd id="myCount">0</dd></div>
          <div class="stat"><dt>컴퓨터가 낸 단어</dt><dd id="foeCount">0</dd></div>
          <div class="stat"><dt>이을 수 있는 단어</dt><dd id="leftCount">—</dd></div>
        </dl>
      </div>
    </aside>
  </main>

  <div class="timer" id="timer" hidden><div class="timer__fill" id="timerFill"></div></div>

  <form class="composer" id="composer" autocomplete="off">
    <input id="wordInput" type="text" inputmode="text" maxlength="12" placeholder="단어를 입력하고 Enter" aria-label="단어 입력">
    <button type="button" class="btn btn--primary btn--go" id="submitBtn">내기</button>
    <button type="button" class="btn" id="hintBtn">힌트 3</button>
  </form>

  <p class="status" id="status" role="status"></p>
  <p class="foot">두 글자 이상 · 사전에 있는 낱말 · 두음법칙 인정 · 같은 단어 두 번 금지</p>
</div>

<script>
(function () {
  "use strict";

  /* ── 단어 사전 ─────────────────────────────────────────── */
  var WORDS = `
    가구 가랑비 가로수 가방 가수 가운데 가을 가족 가지 각도 간장 갈매기 감기 감자 강아지 강조 개구리 거름 거리 거울 건강 건물 걸레 검사 겨울 경기 경찰 계단 계란 계획
    고구마 고등어 고래 고양이 고추 곤충 골목 공기 공원 공책 과일 과자 관심 광장 교사 교실 교통 구두 구름 국수 군인 그림 극장 근육 기린 기술 기차 기초 김치 까마귀 꽃병
    나그네 나라 나무 나물 나비 낙엽 날개 남자 낭비 냄비 냉장고 너구리 노래 노을 녹차 논밭 농구 농사 눈물 뉴스 느낌 늑대 다람쥐 다리미 단추 달력 담요 당근 대나무 대문
    대학 도로 도시 도장 독서 돌고래 동물 동전 돼지 된장 두부 등대 딸기 땅콩 라디오 라면 로봇 리본 마늘 마당 마을 마음 만두 말씀 망치 매미 머리 먼지 메뚜기 며느리 명함
    모래 모자 목소리 무지개 문어 문제 물감 물고기 미소 미술 민들레 바구니 바나나 바다 바람 바위 박물관 반지 발표 밥상 방송 배구 배추 백조 버섯 번개 벚꽃 벽돌 병원 보리
    보물 복숭아 볼펜 부엌 북극 분수 불빛 비누 비행기 빗물 빨래 사과 사슴 사자 사진 산책 상어 새우 색연필 생선 서랍 서류 석유 선물 선생 설탕 성격 세탁기 소금 소나무
    소리 소방차 손가락 수건 수박 수영 수학 숙제 숟가락 술래 시간 시계 시장 식당 식초 신발 신호등 실내 심장 쌀밥 아기 아침 악기 안개 안경 야구 약국 양말 양파 어린이
    얼음 엄지 여름 여우 연극 연필 열쇠 엽서 영화 예술 오리 오이 오후 옥수수 온도 올챙이 옷장 왕자 외국 요리 우동 우산 우유 운동 원숭이 유리 육지 은행 음료수 음악 의사
    의자 이불 이야기 인형 일기 입술 잉어 자동차 자리 자전거 작가 잔디 장갑 장미 재료 저녁 전화 접시 젓가락 정원 제비 조개 종이 주머니 주방 주사위 죽순 지도 지우개
    지하철 진주 질문 짜장면 찌개 차표 참새 창문 책상 천둥 철학 청소 초록 초콜릿 추억 축구 출발 치약 친구 칠판 침대 카메라 칼국수 커피 컴퓨터 코끼리 콩나물 크레파스 키위
    타조 탁구 태극기 태양 택시 토끼 토마토 통장 튤립 트럭 파도 파랑 파인애플 팔찌 편지 평화 포도 표지판 풍선 하늘 하루 학교 학생 한복 할머니 항구 해바라기 햇빛 향기
    허수아비 헬리콥터 호랑이 호수 화분 화살 환경 회의 휴지 흑백 희망
  `.trim().split(/\s+/);

  /* ── 한글 처리 ─────────────────────────────────────────── */
  var BASE = 0xAC00, LAST = 0xD7A3;
  var CHO = ["ㄱ","ㄲ","ㄴ","ㄷ","ㄸ","ㄹ","ㅁ","ㅂ","ㅃ","ㅅ","ㅆ","ㅇ","ㅈ","ㅉ","ㅊ","ㅋ","ㅌ","ㅍ","ㅎ"];
  var JUNG = ["ㅏ","ㅐ","ㅑ","ㅒ","ㅓ","ㅔ","ㅕ","ㅖ","ㅗ","ㅘ","ㅙ","ㅚ","ㅛ","ㅜ","ㅝ","ㅞ","ㅟ","ㅠ","ㅡ","ㅢ","ㅣ"];
  var I_VOWELS = "ㅑㅒㅕㅖㅛㅠㅣ";

  function isSyllable(ch) {
    var code = ch.charCodeAt(0);
    return ch.length === 1 && code >= BASE && code <= LAST;
  }
  function isHangulWord(word) {
    if (!word) return false;
    for (var i = 0; i < word.length; i++) if (!isSyllable(word[i])) return false;
    return true;
  }
  // 두음법칙: ㄹ/ㄴ으로 시작하는 글자가 ㅇ 또는 ㄴ으로 바뀌는 경우를 함께 허용한다.
  function dueumVariants(ch) {
    var out = [ch];
    var code = ch.charCodeAt(0) - BASE;
    var cho = CHO[Math.floor(code / 588)];
    var jungIndex = Math.floor((code % 588) / 28);
    var jung = JUNG[jungIndex];
    var rest = code % 28;
    var isI = I_VOWELS.indexOf(jung) >= 0;
    if (cho === "ㄹ") {
      out.push(String.fromCharCode(BASE + CHO.indexOf(isI ? "ㅇ" : "ㄴ") * 588 + jungIndex * 28 + rest));
    } else if (cho === "ㄴ" && isI) {
      out.push(String.fromCharCode(BASE + CHO.indexOf("ㅇ") * 588 + jungIndex * 28 + rest));
    }
    return out;
  }

  /* ── 사전 조회 ─────────────────────────────────────────── */
  var DICT = Object.create(null);   // 낱말 존재 여부
  var BY_FIRST = Object.create(null); // 첫 글자별 목록
  WORDS.forEach(function (word) {
    if (DICT[word]) return;
    DICT[word] = true;
    (BY_FIRST[word[0]] || (BY_FIRST[word[0]] = [])).push(word);
  });
  var DICT_SIZE = Object.keys(DICT).length;

  function startingWith(ch, used) {
    var found = [];
    dueumVariants(ch).forEach(function (variant) {
      (BY_FIRST[variant] || []).forEach(function (word) {
        if (!used[word]) found.push(word);
      });
    });
    return found;
  }

  /* ── 게임 상태 ─────────────────────────────────────────── */
  var state = {
    history: [],      // [{ word, who }]
    used: Object.create(null),
    turn: "me",
    over: false,
    hints: 3,
    difficulty: "normal",
    timeLimit: 0
  };

  function nextChar() {
    if (!state.history.length) return null;
    var word = state.history[state.history.length - 1].word;
    return word[word.length - 1];
  }
  function candidates() {
    var ch = nextChar();
    if (!ch) return WORDS.filter(function (w) { return !state.used[w]; });
    return startingWith(ch, state.used);
  }
  function replyCount(word) {
    var used = Object.create(null);
    for (var key in state.used) used[key] = true;
    used[word] = true;
    return startingWith(word[word.length - 1], used).length;
  }
  function pick(list) { return list[Math.floor(Math.random() * list.length)]; }

  function chooseComputerWord() {
    var options = candidates();
    if (!options.length) return null;
    if (state.difficulty === "normal") return pick(options);
    var scored = options.map(function (word) { return { word: word, replies: replyCount(word) }; });
    // 쉬움: 상대가 이어 가기 쉬운 쪽, 어려움: 상대가 받을 단어가 가장 적은 쪽
    var best = state.difficulty === "hard"
      ? Math.min.apply(null, scored.map(function (s) { return s.replies; }))
      : Math.max.apply(null, scored.map(function (s) { return s.replies; }));
    return pick(scored.filter(function (s) { return s.replies === best; }).map(function (s) { return s.word; }));
  }

  // 규칙 위반이면 안내 문구를, 통과하면 null을 돌려준다.
  function check(word) {
    if (word.length < 2) return "두 글자 이상이어야 합니다.";
    if (!isHangulWord(word)) return "한글 낱말만 쓸 수 있습니다.";
    if (state.used[word]) return "'" + word + "'은(는) 이미 나온 단어입니다.";
    if (!DICT[word]) return "'" + word + "'은(는) 사전에 없는 단어입니다.";
    var ch = nextChar();
    if (ch) {
      var allowed = dueumVariants(ch);
      if (allowed.indexOf(word[0]) < 0) {
        return allowed.map(function (c) { return "'" + c + "'"; }).join(" 또는 ") + "(으)로 시작해야 합니다.";
      }
    }
    return null;
  }

  /* ── 화면 ──────────────────────────────────────────────── */
  var el = {};
  ["chain","empty","seeds","nextChar","also","myCount","foeCount","leftCount","timer","timerFill",
   "composer","wordInput","submitBtn","hintBtn","status","restart","difficulty","first","timeLimit","dictCount"]
    .forEach(function (id) { el[id] = document.getElementById(id); });

  el.dictCount.textContent = DICT_SIZE;

  function setStatus(text, kind) {
    el.status.textContent = text || "";
    el.status.className = "status" + (kind ? " status--" + kind : "");
  }

  function renderChain() {
    var fresh = document.createDocumentFragment();
    state.history.forEach(function (entry, index) {
      var card = document.createElement("div");
      card.className = "card card--" + entry.who + (index === state.history.length - 1 ? " card--new" : "");
      var who = document.createElement("span");
      who.className = "card__who";
      who.textContent = entry.who === "me" ? "나" : "컴퓨터";
      var word = document.createElement("div");
      word.className = "word";
      for (var i = 0; i < entry.word.length; i++) {
        var syl = document.createElement("span");
        syl.className = "syl" + (i === entry.word.length - 1 ? " syl--link" : "");
        syl.textContent = entry.word[i];
        word.appendChild(syl);
      }
      card.appendChild(who);
      card.appendChild(word);
      fresh.appendChild(card);
    });
    el.chain.textContent = "";
    if (!state.history.length) {
      el.chain.appendChild(el.empty);
      el.empty.hidden = false;
    } else {
      el.chain.appendChild(fresh);
      el.chain.scrollTop = el.chain.scrollHeight;
    }
  }

  function renderPanel() {
    var ch = nextChar();
    el.nextChar.textContent = ch || "·";
    el.nextChar.className = "tile" + (ch ? "" : " tile--idle");
    if (ch) {
      var others = dueumVariants(ch).slice(1);
      el.also.innerHTML = "";
      if (others.length) {
        el.also.appendChild(document.createTextNode("두음법칙: "));
        var b = document.createElement("b");
        b.textContent = others.join(", ");
        el.also.appendChild(b);
        el.also.appendChild(document.createTextNode("(으)로 시작해도 됩니다"));
      }
    } else {
      el.also.textContent = "첫 낱말은 자유입니다";
    }
    var mine = 0, foe = 0;
    state.history.forEach(function (entry) { entry.who === "me" ? mine++ : foe++; });
    el.myCount.textContent = mine;
    el.foeCount.textContent = foe;
    el.leftCount.textContent = state.history.length ? candidates().length + "개" : "—";
    el.hintBtn.textContent = "힌트 " + state.hints;
    el.hintBtn.disabled = state.over || state.hints === 0 || state.turn !== "me";
  }

  function render() { renderChain(); renderPanel(); }

  function setInputEnabled(on) {
    el.wordInput.disabled = !on;
    el.submitBtn.disabled = !on;
    if (on) el.wordInput.focus();
  }

  /* ── 제한 시간 ─────────────────────────────────────────── */
  var timerHandle = null, deadline = 0;

  function stopTimer() {
    if (timerHandle) cancelAnimationFrame(timerHandle);
    timerHandle = null;
    el.timer.hidden = true;
  }
  function startTimer() {
    stopTimer();
    if (!state.timeLimit || state.over) return;
    deadline = performance.now() + state.timeLimit * 1000;
    el.timer.hidden = false;
    tick();
  }
  function tick() {
    var left = deadline - performance.now();
    var total = state.timeLimit * 1000;
    var ratio = Math.max(0, left / total);
    el.timerFill.style.transform = "scaleX(" + ratio + ")";
    el.timerFill.className = "timer__fill" + (ratio < 0.25 ? " timer__fill--low" : "");
    if (left <= 0) {
      stopTimer();
      finish("computer", "시간이 다 됐습니다.");
      return;
    }
    timerHandle = requestAnimationFrame(tick);
  }

  /* ── 진행 ──────────────────────────────────────────────── */
  function play(word, who) {
    state.history.push({ word: word, who: who });
    state.used[word] = true;
  }

  function finish(winner, reason) {
    state.over = true;
    stopTimer();
    setInputEnabled(false);
    render();
    var total = state.history.length;
    setStatus(
      (winner === "me" ? "이겼습니다. " : "졌습니다. ") + reason + " (총 " + total + "수)",
      winner === "me" ? "win" : "lose"
    );
    el.restart.className = "btn btn--primary";
    el.restart.focus();
  }

  function computerTurn() {
    state.turn = "computer";
    setInputEnabled(false);
    renderPanel();
    setStatus("컴퓨터가 생각 중…");
    setTimeout(function () {
      var word = chooseComputerWord();
      if (!word) {
        finish("me", "컴퓨터가 이을 낱말을 찾지 못했습니다.");
        return;
      }
      play(word, "computer");
      render();
      myTurn();
    }, 450 + Math.random() * 400);
  }

  function myTurn() {
    state.turn = "me";
    if (!candidates().length) {
      finish("computer", "사전에 이을 낱말이 남지 않았습니다.");
      return;
    }
    setStatus("");
    setInputEnabled(true);
    renderPanel();
    startTimer();
  }

  function submitWord() {
    if (state.over || state.turn !== "me") return;
    var word = el.wordInput.value.trim();
    if (!word) return;
    var problem = check(word);
    if (problem) {
      setStatus(problem, "bad");
      el.wordInput.select();
      return;
    }
    stopTimer();
    el.wordInput.value = "";
    play(word, "me");
    render();
    computerTurn();
  }

  function useHint() {
    if (state.over || state.turn !== "me" || state.hints === 0) return;
    var options = candidates();
    if (!options.length) return;
    state.hints--;
    var word = pick(options);
    el.wordInput.value = word;
    el.wordInput.focus();
    setStatus("힌트: " + word + " — 그대로 내거나 지우고 다른 낱말을 쓰세요.", "good");
    renderPanel();
  }

  function newGame() {
    stopTimer();
    state.history = [];
    state.used = Object.create(null);
    state.over = false;
    state.hints = 3;
    state.difficulty = el.difficulty.value;
    state.timeLimit = Number(el.timeLimit.value);
    el.wordInput.value = "";
    el.restart.className = "btn";
    setStatus("");
    render();
    if (el.first.value === "computer") computerTurn();
    else myTurn();
  }

  /* ── 시작 단어 제안 ────────────────────────────────────── */
  function fillSeeds() {
    el.seeds.textContent = "";
    var used = Object.create(null), shown = 0;
    while (shown < 3) {
      var word = pick(WORDS);
      if (used[word]) continue;
      used[word] = true;
      shown++;
      var button = document.createElement("button");
      button.type = "button";
      button.className = "seed";
      button.textContent = word;
      button.addEventListener("click", function (event) {
        if (state.over || state.turn !== "me") return;
        el.wordInput.value = event.currentTarget.textContent;
        submitWord();
      });
      el.seeds.appendChild(button);
    }
  }

  /* ── 입력 처리 (한글 IME 고려) ─────────────────────────── */
  var composing = false;
  el.wordInput.addEventListener("compositionstart", function () { composing = true; });
  el.wordInput.addEventListener("compositionend", function () { composing = false; });
  el.wordInput.addEventListener("keydown", function (event) {
    if (event.key !== "Enter") return;
    event.preventDefault();
    if (event.isComposing || composing) return; // 조합 중 Enter는 글자 확정용
    submitWord();
  });
  el.composer.addEventListener("submit", function (event) { event.preventDefault(); });
  el.submitBtn.addEventListener("click", submitWord);
  el.hintBtn.addEventListener("click", useHint);
  el.restart.addEventListener("click", function () { fillSeeds(); newGame(); });
  el.difficulty.addEventListener("change", function () { state.difficulty = el.difficulty.value; });
  el.timeLimit.addEventListener("change", function () {
    state.timeLimit = Number(el.timeLimit.value);
    if (!state.over && state.turn === "me") startTimer(); else stopTimer();
  });

  fillSeeds();
  newGame();
})();
</script>
</body>
</html>
